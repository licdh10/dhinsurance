<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102B59" />
      <stop offset="100%" stop-color="#1769AA" />
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD51B" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
  </defs>

  <!-- Monogram Emblem -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoBgGrad)" stroke="#FFD51B" stroke-width="2.5" />
    
    <!-- Letter D -->
    <path d="M 18 20 L 32 20 C 44 20 54 28 54 42 C 54 56 44 64 32 64 L 18 64 Z" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linejoin="round" />
    <!-- Letter H -->
    <path d="M 50 20 L 50 64" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 72 20 L 72 64" fill="none" stroke="url(#logoGold)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 50 42 L 72 42" fill="none" stroke="#FFD51B" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Spark dot -->
    <circle cx="84" cy="20" r="4.5" fill="#FFD51B" />
  </g>

  <!-- Typography -->
  <g transform="translate(128, 48)">
    <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="32" fill="#102B59" letter-spacing="0.5">
      DH INSURANCE
    </text>
    <text y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#1769AA" letter-spacing="2.5">
      &amp; DIGITAL SERVICE
    </text>
    <text y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748B" letter-spacing="1">
      BANKING CSP • INSURANCE • LOANS • CITIZEN SERVICES
    </text>
  </g>
</svg>
