<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102B59" />
      <stop offset="100%" stop-color="#1769AA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD51B" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#FFD51B" stroke-width="2.5" />
  
  <!-- Inner Subtle Accent Arc -->
  <path d="M 24 96 A 50 50 0 0 1 96 24" fill="none" stroke="rgba(255, 213, 27, 0.15)" stroke-width="4" stroke-linecap="round" />
  
  <!-- DH Monogram Mark -->
  <g filter="url(#shadow)" transform="translate(18, 26)">
    <!-- Letter D -->
    <path d="M 12 8 L 26 8 C 42 8 52 18 52 34 C 52 50 42 60 26 60 L 12 60 Z" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linejoin="round" />
    <path d="M 22 18 L 26 18 C 34 18 41 24 41 34 C 41 44 34 50 26 50 L 22 50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Letter H integrated -->
    <path d="M 48 8 L 48 60" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 72 8 L 72 60" fill="none" stroke="url(#goldGrad)" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 48 34 L 72 34" fill="none" stroke="#FFD51B" stroke-width="7" stroke-linecap="round" />
  </g>
  
  <!-- Security / Digital Star Element -->
  <polygon points="98,18 101,24 107,25 102,29 104,36 98,32 92,36 94,29 89,25 95,24" fill="#FFD51B" />
</svg>
